name: snake
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: oechenique
          outputs: |
            dist/snake-neon.svg?palette=github-dark&color_snake=#ff2e63&color_dots=#161b22,#0b3d4f,#0e6f8a,#12a5c9,#3ff0ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
